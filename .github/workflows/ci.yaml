name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kubeconform:
    name: kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Validate manifests
        run: |
          set -euo pipefail
          mapfile -t files < <(
            find kubernetes/apps kubernetes/argo \
              kubernetes/bootstrap/argo-apps.yaml \
              kubernetes/bootstrap/argo-apps-mgmt.yaml \
              -type f \( -name '*.yaml' -o -name '*.yml' \) \
              ! -name 'values.yaml' \
              ! -name 'ha-values.yaml' \
              ! -name 'kustomization.yaml' \
              ! -path '*/cloudflare-tunnel/ingress.yaml' \
              | sort
          )
          kubectl kustomize kubernetes/argo/clusters/home-ops > /tmp/argo-home-ops.yaml
          kubectl kustomize kubernetes/argo/clusters/mgmt > /tmp/argo-mgmt.yaml

          kubeconform \
            -summary \
            -strict \
            -ignore-missing-schemas \
            -kubernetes-version 1.36.3 \
            "${files[@]}" \
            /tmp/argo-home-ops.yaml \
            /tmp/argo-mgmt.yaml

  omni-validate:
    name: omni-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Render Omni bootstrap manifests
        run: mise run manifests-render

      - name: Validate Omni cluster templates
        working-directory: kubernetes/bootstrap/talos
        run: |
          set -euo pipefail
          omnictl cluster template validate -f omni-home-ops.yaml
          omnictl cluster template validate -f omni-mgmt.yaml
