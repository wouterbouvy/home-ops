---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  hostnames:
  - longhorn.home-ops.nl
  parentRefs:
  - name: external
    namespace: kube-system
  rules:
  # Embedded Authentik proxy outpost (Host-based) → Longhorn UI upstream.
  - backendRefs:
    - name: authentik-server
      namespace: authentik
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
