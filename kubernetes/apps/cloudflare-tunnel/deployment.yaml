---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      initContainers:
        - name: credentials
          image: alpine:3.21
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel
                  key: TUNNEL_TOKEN
          command:
            - /bin/sh
            - -ec
            - |
              apk add --no-cache --quiet jq
              token="${TUNNEL_TOKEN}"
              out=/shared/credentials.json
              # TUNNEL_TOKEN is base64(JSON). Compact install tokens use a/t/s;
              # JWT tokens use the same payload fields after decoding the middle segment.
              if printf '%s' "${token}" | grep -q '\.'; then
                payload="$(printf '%s' "${token}" | cut -d. -f2 | tr '_-' '/+')"
                pad=$(( (4 - ${#payload} % 4) % 4 ))
                i=0
                while [ "${i}" -lt "${pad}" ]; do payload="${payload}="; i=$((i + 1)); done
                raw="$(printf '%s' "${payload}" | base64 -d)"
              else
                raw="$(printf '%s' "${token}" | base64 -d)"
              fi
              printf '%s' "${raw}" | jq -c '
                if .AccountTag and .TunnelID and .TunnelSecret then
                  {AccountTag, TunnelID, TunnelSecret}
                elif .a and .t and .s then
                  {AccountTag: .a, TunnelID: .t, TunnelSecret: .s}
                else
                  error("unsupported TUNNEL_TOKEN JSON shape")
                end
              ' > "${out}"
              jq -e '.AccountTag and .TunnelID and .TunnelSecret' "${out}" >/dev/null
          volumeMounts:
            - name: shared
              mountPath: /shared
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.3.0
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - --no-autoupdate
            - run
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: shared
              mountPath: /etc/cloudflared/credentials.json
              subPath: credentials.json
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
      volumes:
        - name: config
          configMap:
            name: cloudflare-tunnel-config
        - name: shared
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cloudflared
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
