---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# 1Password item "cloudflare-tunnel" in vault k8s-secrets must contain:
#   TUNNEL_TOKEN — Cloudflare Tunnel install token
#   TUNNEL ID    — Tunnel UUID (label may be "TUNNEL ID" or "TUNNEL_ID")
#   ACCOUNT_ID   — Cloudflare account ID
#   ZONE_ID      — Zone ID for home-ops.nl
# API token is reused from item "cloudflare" / CLOUDFLARE_DNS_TOKEN (cert-manager).
# That token needs Zone DNS Edit and Account Cloudflare Tunnel Edit.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel
  namespace: cloudflare-tunnel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: cloudflare-tunnel
    creationPolicy: Owner
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef:
        key: cloudflare-tunnel
        property: TUNNEL_TOKEN
    - secretKey: TUNNEL_ID
      remoteRef:
        key: cloudflare-tunnel
        property: TUNNEL ID
    - secretKey: ACCOUNT_ID
      remoteRef:
        key: cloudflare-tunnel
        property: ACCOUNT_ID
    - secretKey: ZONE_ID
      remoteRef:
        key: cloudflare-tunnel
        property: ZONE_ID
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: cloudflare
        property: CLOUDFLARE_DNS_TOKEN
