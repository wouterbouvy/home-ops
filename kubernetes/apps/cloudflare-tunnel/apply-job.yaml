---
apiVersion: batch/v1
kind: Job
metadata:
  name: cloudflare-tunnel-apply
  namespace: cloudflare-tunnel
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: cloudflare-tunnel-apply
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-tunnel-apply
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply
          image: alpine:3.21
          imagePullPolicy: IfNotPresent
          env:
            - name: ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel
                  key: ACCOUNT_ID
            - name: TUNNEL_ID
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel
                  key: TUNNEL_ID
            - name: ZONE_ID
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel
                  key: ZONE_ID
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel
                  key: CLOUDFLARE_API_TOKEN
            - name: INGRESS_FILE
              value: /config/ingress.yaml
          command:
            - /bin/sh
            - -ec
            - |
              apk add --no-cache --quiet curl jq yq
              exec /scripts/cloudflare-tunnel-apply.sh
          volumeMounts:
            - name: ingress
              mountPath: /config
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: ingress
          configMap:
            name: cloudflare-tunnel-ingress
        - name: scripts
          configMap:
            name: cloudflare-tunnel-apply-script
            defaultMode: 0755
