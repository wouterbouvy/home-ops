apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  - ./externalsecret.yaml
  - ./deployment.yaml
  - ./dnsendpoint.yaml
configMapGenerator:
  - name: cloudflare-tunnel-config
    files:
      - config.yaml
generatorOptions:
  disableNameSuffixHash: true
