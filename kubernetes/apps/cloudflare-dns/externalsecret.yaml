---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Reuses 1Password item "cloudflare" / CLOUDFLARE_DNS_TOKEN (same as cert-manager).
# Needs Zone DNS Edit on home-ops.nl.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-dns
  namespace: cloudflare-dns
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: cloudflare-dns-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        api-token: "{{ .CLOUDFLARE_DNS_TOKEN }}"
  dataFrom:
    - extract:
        key: cloudflare
