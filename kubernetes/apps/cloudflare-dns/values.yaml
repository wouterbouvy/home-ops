# external-dns (app name cloudflare-dns) — Cloudflare provider
fullnameOverride: cloudflare-dns

provider:
  name: cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-dns-secret
        key: api-token

policy: sync
registry: txt
txtOwnerId: home-ops
txtPrefix: k8s.
domainFilters:
  - home-ops.nl

sources:
  - crd
  - gateway-httproute

extraArgs:
  cloudflare-proxied: ""
  crd-source-apiversion: externaldns.k8s.io/v1alpha1
  crd-source-kind: DNSEndpoint

triggerLoopOnEvent: true

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi
