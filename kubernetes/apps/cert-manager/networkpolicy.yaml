---
# Allow DNS, API server, and HTTPS (Cloudflare DNS-01 / ACME).
# Webhook admission from control plane; metrics from monitoring.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9402
        - protocol: TCP
          port: 10250
        - protocol: TCP
          port: 6080
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # External HTTPS (Cloudflare API, Let's Encrypt)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
