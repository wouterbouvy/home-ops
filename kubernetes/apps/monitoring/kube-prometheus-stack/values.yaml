# Home-ops sized kube-prometheus-stack: single replicas, 7d retention, Longhorn PVC.
# Talos: disable scrapes for host control-plane components that are not reachable like kubeadm.

crds:
  enabled: true

defaultRules:
  create: true
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

grafana:
  enabled: true
  replicas: 1
  admin:
    existingSecret: ""
  # OIDC via Authentik; client secret from ExternalSecret grafana-oidc.
  # Local login form/basic auth disabled (break-glass: re-enable in values and sync).
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client_secret
  grafana.ini:
    server:
      root_url: https://grafana.home-ops.nl
      domain: grafana.home-ops.nl
    auth:
      disable_login_form: true
    auth.basic:
      enabled: false
    auth.generic_oauth:
      enabled: true
      name: Authentik
      allow_sign_up: true
      auto_login: false
      client_id: grafana
      scopes: openid profile email offline_access
      auth_url: https://authentik.home-ops.nl/application/o/authorize/
      token_url: https://authentik.home-ops.nl/application/o/token/
      api_url: https://authentik.home-ops.nl/application/o/userinfo/
      role_attribute_path: contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Home Ops Users') && 'Editor' || 'Viewer'
      login_attribute_path: preferred_username
      name_attribute_path: name
      email_attribute_path: email
      groups_attribute_path: groups
      use_pkce: true
  ingress:
    enabled: false
  serviceMonitor:
    enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true

kubernetesServiceMonitors:
  enabled: true

kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

kubeApiServer:
  enabled: true

kubelet:
  enabled: true
  serviceMonitor:
    https: true
    insecureSkipVerify: true

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d
    scrapeInterval: 60s
    evaluationInterval: 60s
    # Scrape ServiceMonitors/PodMonitors cluster-wide (Spegel, Cilium, Argo, …).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    additionalScrapeConfigs: []

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
