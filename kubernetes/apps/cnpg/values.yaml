# CloudNativePG operator — cluster-wide, single replica (home-ops sized).
replicaCount: 1

crds:
  create: true

config:
  clusterWide: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

monitoring:
  podMonitorEnabled: true
  grafanaDashboard:
    create: false
