apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  # annotations:
    # external-dns.alpha.kubernetes.io/target: external.home-ops.nl
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 10.0.8.120
  # infrastructure:
  #   annotations:
      # external-dns.alpha.kubernetes.io/hostname: external.home-ops.nl
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: '*.home-ops.nl'
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: '*.home-ops.nl'
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: home-ops-nl-staging-tls
