---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  hostnames:
    - hubble.home-ops.nl
  parentRefs:
    - name: external
      namespace: kube-system
  rules:
    # Embedded Authentik proxy outpost (Host-based) → Hubble UI upstream.
    - backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
