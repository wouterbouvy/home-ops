apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-ops-nl-staging
  # Staging LE cert (intentional). See root README TLS section.
spec:
  secretName: home-ops-nl-staging-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  commonName: home-ops.nl
  dnsNames:
    - home-ops.nl
    - '*.home-ops.nl'
