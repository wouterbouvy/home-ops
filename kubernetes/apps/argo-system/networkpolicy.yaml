---
# Allow Cilium Gateway (kube-system) and Cloudflare Tunnel connectors to reach argocd-server.
# Do NOT use podSelector: {} here — that would deny peer traffic (e.g. redis-ha).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argo-cd-server-gateway
  namespace: argo-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8083
