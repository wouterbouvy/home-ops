apiVersion: v1alpha1
kind: VolumeConfig
name: STATE
encryption:
  provider: luks2
  keys:
    # PCR 11 only (signed SecureBoot UKI policy). Empty pcrs skips PCR 7, which
    # often mismatches across install vs reboot on OEM firmware (TPM_RC_BAD_AUTH).
    - tpm:
        options:
          pcrs: []
      slot: 0
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
encryption:
  provider: luks2
  keys:
    - tpm:
        options:
          pcrs: []
      slot: 0
