[env]
OMNICONFIG = "{{config_root}}/omniconfig"
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talosconfig"
_.file = "{{config_root}}/kubernetes/versions.env"

[vars]
cluster = 'default'

[tools]
"aqua:siderolabs/talos" = "1.13.7"
"aqua:siderolabs/omni/omnictl" = "1.9.3"
"aqua:kubernetes/kubectl" = "1.36.2"
"aqua:helm/helm" = "3.18.6"
"aqua:cilium/cilium-cli" = "0.19.7"
"aqua:jqlang/jq" = "1.8.2"
"aqua:1password/cli" = "v2.35.0"
"aqua:kubevirt/kubevirt/virtctl" = "v1.8.4"
"aqua:int128/kubelogin" = "1.36.2"

[tasks.manifests-render]
description = "Render Cilium, CoreDNS, Spegel, and Argo CD Helm charts to Omni bootstrap manifests"
run = [
    "mkdir -p manifests",
    "curl -fsSL -o manifests/gateway-api.yaml \"https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml\"",
    "helm repo add cilium https://helm.cilium.io --force-update",
    "helm repo update cilium",
    "helm template cilium cilium/cilium --version \"${CILIUM_CHART_VERSION}\" --namespace kube-system --values ../../apps/kube-system/cilium/values.yaml > manifests/cilium.yaml",
    "helm template coredns oci://ghcr.io/coredns/charts/coredns --version \"${COREDNS_CHART_VERSION}\" --namespace kube-system --values ../../apps/kube-system/coredns/values.yaml > manifests/coredns.yaml",
    "helm template spegel oci://ghcr.io/spegel-org/helm-charts/spegel --version \"${SPEGEL_CHART_VERSION}\" --namespace kube-system --values ../../apps/kube-system/spegel/values.yaml > manifests/spegel.yaml",
    """printf '%s\\n' '---' 'apiVersion: v1' 'kind: Namespace' 'metadata:' '  name: argo-system' > manifests/argo-cd.yaml""",
    "helm template argo-cd oci://ghcr.io/argoproj/argo-helm/argo-cd --version \"${ARGOCD_CHART_VERSION}\" --namespace argo-system --values ../../apps/argo-system/values.yaml --include-crds >> manifests/argo-cd.yaml",
]
dir = "kubernetes/bootstrap/talos"

[tasks.omni-validate]
description = "Validate Omni configuration"
run = [
    "omnictl cluster template validate -f omni-home-ops.yaml",
]
dir = "kubernetes/bootstrap/talos"

[tasks.omni-sync]
description = 'Sync cluster'
run = [
    "mise run manifests-render",
    "omnictl cluster template sync -f omni-home-ops.yaml",
    "omnictl talosconfig --merge=false --force $TALOSCONFIG",
    "omnictl kubeconfig -c home-ops --merge=false --force $KUBECONFIG"
]
dir = "kubernetes/bootstrap/talos"
depends = ["omni-validate"]

[tasks.omni-bootstrap]
description = 'Bootstrap cluster'
run = [
    "until kubectl --kubeconfig $KUBECONFIG --context=k5s-home-ops-home-ops wait --for=condition=Ready nodes --all --timeout=600s; do sleep 10; done",
    "mise run omni-1password-bootstrap",
    "kubectl --kubeconfig $KUBECONFIG --context=k5s-home-ops-home-ops -n argo-system wait --for=condition=available deployment -l app.kubernetes.io/name=argocd-server --timeout=600s",
    "kubectl --kubeconfig $KUBECONFIG --context=k5s-home-ops-home-ops --namespace argo-system apply --server-side --filename argo-apps.yaml"
]
depends = ["omni-sync"]
dir = "kubernetes/bootstrap"

[tasks.omni-1password-bootstrap]
description = "Create 1Password token for External Secrets Operator"
run = [
    "kubectl get namespace external-secrets || kubectl create namespace external-secrets",
    "op read op://k8s-secrets/kjbt5chc4fgrgsian5acx2f74u/credential --out-file 1password-token",
    "kubectl create secret generic 1password-token -n external-secrets --from-file=token=1password-token --dry-run=client -o yaml | kubectl apply -f -",
    "rm 1password-token",
    "op signout",
]

[tasks.omni-reset]
description = 'Reset cluster'
run = "omnictl cluster template delete -f omni-home-ops.yaml"
dir = "kubernetes/bootstrap/talos"

[tasks.omni-wipedisks]
description = 'Wipe disks'
run = [
    "talosctl -n 10.0.8.3 wipe disk sda --drop-partition",
    "talosctl -n 10.0.8.4 wipe disk sda --drop-partition",
    "talosctl -n 10.0.8.5 wipe disk sda --drop-partition"
]

[tasks.omni-reboot]
description = 'Reboot nodes'
run = [
    "talosctl -n 10.0.8.3 reboot",
    "talosctl -n 10.0.8.4 reboot",
    "talosctl -n 10.0.8.5 reboot"
]
