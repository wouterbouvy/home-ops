redactions = ["OMNI_SERVICE_ACCOUNT_KEY"]

[env]
# Omni SA is loaded only by scripts/with-omni-sa.sh for omnictl tasks (not every mise run).
# Do not set OMNICONFIG alongside OMNI_ENDPOINT / OMNI_SERVICE_ACCOUNT_KEY — they conflict.
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talosconfig"
_.file = "{{config_root}}/kubernetes/versions.env"

[vars]
cluster = 'default'
# Stable kubectl context names written by omni-*-sync (home-ops is default).
kube_context_home_ops = 'home-ops'
kube_context_mgmt = 'management'

[tools]
"aqua:siderolabs/talos" = "1.13.7"
"aqua:siderolabs/omni/omnictl" = "1.10.4"
# Keep kubectl + kubelogin on the cluster Kubernetes version (kubernetes/versions.env).
"aqua:kubernetes/kubectl" = "{{env.KUBERNETES_VERSION}}"
"aqua:helm/helm" = "4.2.3"
"aqua:cilium/cilium-cli" = "0.19.7"
"aqua:jqlang/jq" = "1.8.2"
"aqua:mikefarah/yq" = "4.45.4"
"aqua:1password/cli" = "v2.35.0"
"aqua:kubevirt/kubevirt/virtctl" = "v1.9.0"
"aqua:int128/kubelogin" = "{{env.KUBERNETES_VERSION}}"
"aqua:yannh/kubeconform" = "0.8.0"

[tasks.manifests-render]
description = "Render Cilium, CoreDNS, Spegel, and Argo CD Helm charts to Omni bootstrap manifests"
run = [
    "mkdir -p manifests",
    "curl -fsSL -o manifests/gateway-api.yaml \"https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml\"",
    "helm repo add cilium https://helm.cilium.io --force-update",
    "helm repo update cilium",
    "helm template cilium cilium/cilium --version \"${CILIUM_CHART_VERSION}\" --namespace kube-system --values ../../apps/kube-system/cilium/values.yaml > manifests/cilium.yaml",
    # Helm 4 prints OCI Pulled/Digest lines to stdout; strip them so Omni gets valid YAML.
    "helm template coredns oci://ghcr.io/coredns/charts/coredns --version \"${COREDNS_CHART_VERSION}\" --namespace kube-system --values ../../apps/kube-system/coredns/values.yaml | sed -e '/^Pulled:/d' -e '/^Digest:/d' > manifests/coredns.yaml",
    "helm template spegel oci://ghcr.io/spegel-org/helm-charts/spegel --version \"${SPEGEL_CHART_VERSION}\" --namespace kube-system --values ../../apps/kube-system/spegel/values.yaml | sed -e '/^Pulled:/d' -e '/^Digest:/d' > manifests/spegel.yaml",
    """printf '%s\\n' '---' 'apiVersion: v1' 'kind: Namespace' 'metadata:' '  name: argo-system' > manifests/argo-cd.yaml""",
    "helm template argo-cd oci://ghcr.io/argoproj/argo-helm/argo-cd --version \"${ARGOCD_CHART_VERSION}\" --namespace argo-system --values ../../apps/argo-system/values.yaml --include-crds | sed -e '/^Pulled:/d' -e '/^Digest:/d' >> manifests/argo-cd.yaml",
]
dir = "kubernetes/bootstrap/talos"

[tasks.omnictl]
description = "Run omnictl with Cursor Omni SA from 1Password"
run = """
#!/usr/bin/env bash
set -euo pipefail
exec "{{config_root}}/scripts/with-omni-sa.sh" omnictl "$@"
"""

[tasks.headlamp-desktop-kubeconfig]
description = "Mint gitignored kubeconfig-headlamp-desktop for desktop Headlamp (SA token)"
run = "{{config_root}}/scripts/headlamp-desktop-kubeconfig.sh"

[tasks.cloudflare-tunnel-config-sync]
description = "Push cloudflare-tunnel config.yaml ingress to Cloudflare API (remote-managed tunnels)"
run = "{{config_root}}/scripts/cloudflare-tunnel-config-sync.sh"

[tasks.omni-validate]
description = "Validate home-ops Omni cluster template"
run = [
    "{{config_root}}/scripts/with-omni-sa.sh omnictl cluster template validate -f omni-home-ops.yaml",
]
dir = "kubernetes/bootstrap/talos"

[tasks.omni-sync]
description = "Sync home-ops cluster; merge kube/talos contexts and set home-ops as default"
run = [
    "mise run manifests-render",
    "{{config_root}}/scripts/with-omni-sa.sh omnictl cluster template sync -f omni-home-ops.yaml",
    "{{config_root}}/scripts/with-omni-sa.sh omnictl talosconfig -c home-ops --merge $TALOSCONFIG",
    "{{config_root}}/scripts/with-omni-sa.sh omnictl kubeconfig -c home-ops --merge --force-context-name {{vars.kube_context_home_ops}} $KUBECONFIG",
    "kubectl config use-context {{vars.kube_context_home_ops}}",
    # omnictl --merge already selects the new Talos context (named like k5s-home-ops-home-ops)
]
dir = "kubernetes/bootstrap/talos"
depends = ["omni-validate"]

[tasks.omni-bootstrap]
description = "Bootstrap home-ops cluster (ESO token + root apps Application)"
run = [
    "until kubectl --context={{vars.kube_context_home_ops}} wait --for=condition=Ready nodes --all --timeout=600s; do sleep 10; done",
    "mise run omni-1password-bootstrap",
    "kubectl --context={{vars.kube_context_home_ops}} -n argo-system wait --for=condition=available deployment -l app.kubernetes.io/name=argocd-server --timeout=600s",
    "kubectl --context={{vars.kube_context_home_ops}} --namespace argo-system apply --server-side --filename argo-apps.yaml",
]
depends = ["omni-sync"]
dir = "kubernetes/bootstrap"

[tasks.omni-1password-bootstrap]
description = "Create 1Password token for External Secrets Operator"
run = [
    "kubectl --context={{vars.kube_context_home_ops}} get namespace external-secrets || kubectl --context={{vars.kube_context_home_ops}} create namespace external-secrets",
    "op read op://k8s-secrets/kjbt5chc4fgrgsian5acx2f74u/credential --out-file 1password-token",
    "kubectl --context={{vars.kube_context_home_ops}} create secret generic 1password-token -n external-secrets --from-file=token=1password-token --dry-run=client -o yaml | kubectl --context={{vars.kube_context_home_ops}} apply -f -",
    "rm 1password-token",
    "op signout",
]

[tasks.omni-reset]
description = "Reset home-ops cluster template"
run = "{{config_root}}/scripts/with-omni-sa.sh omnictl cluster template delete -f omni-home-ops.yaml"
dir = "kubernetes/bootstrap/talos"

[tasks.omni-mgmt-validate]
description = "Validate management Omni cluster template (scaffold; full testing later)"
run = [
    "{{config_root}}/scripts/with-omni-sa.sh omnictl cluster template validate -f omni-mgmt.yaml",
]
dir = "kubernetes/bootstrap/talos"

[tasks.omni-mgmt-sync]
description = "Sync management cluster; merge contexts into shared kube/talos configs; keep home-ops default"
run = [
    "mise run manifests-render",
    "{{config_root}}/scripts/with-omni-sa.sh omnictl cluster template sync -f omni-mgmt.yaml",
    "{{config_root}}/scripts/with-omni-sa.sh omnictl talosconfig -c management --merge $TALOSCONFIG",
    "{{config_root}}/scripts/with-omni-sa.sh omnictl kubeconfig -c management --merge --force-context-name {{vars.kube_context_mgmt}} $KUBECONFIG",
    "kubectl config use-context {{vars.kube_context_home_ops}}",
    # Prefer the home-ops Talos context if present (Omni name, not 'home-ops')
    "bash -c 'ctx=$(talosctl config contexts | awk \"NR>1 {n=(\\$1==\\\"*\\\"?\\$2:\\$1); if (n ~ /home-ops/ && n !~ /management/) print n}\" | head -1); [ -n \\\"$ctx\\\" ] && talosctl config context \\\"$ctx\\\"'",
]
dir = "kubernetes/bootstrap/talos"
depends = ["omni-mgmt-validate"]

[tasks.omni-mgmt-reset]
description = "Reset management cluster template"
run = "{{config_root}}/scripts/with-omni-sa.sh omnictl cluster template delete -f omni-mgmt.yaml"
dir = "kubernetes/bootstrap/talos"

[tasks.omni-wipedisks]
description = "Wipe Longhorn-related disks on home-ops nodes"
run = [
    "talosctl -n 10.0.8.3 wipe disk sda --drop-partition",
    "talosctl -n 10.0.8.4 wipe disk sda --drop-partition",
    "talosctl -n 10.0.8.5 wipe disk sda --drop-partition",
]

[tasks.omni-reboot]
description = "Reboot home-ops nodes"
run = [
    "talosctl -n 10.0.8.3 reboot",
    "talosctl -n 10.0.8.4 reboot",
    "talosctl -n 10.0.8.5 reboot",
]
